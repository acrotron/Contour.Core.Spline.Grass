version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 10
    target-branch: "main"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 10
    target-branch: "main"
    groups:
      # One PR for all test tooling; library dependencies stay individual.
      test-packages:
        patterns:
          - "MSTest*"
          - "Microsoft.NET.Test.Sdk"
          - "Microsoft.Testing.*"
          - "coverlet*"
          - "AwesomeAssertions"
          - "Moq"
